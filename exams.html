<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Exams - TuitionFlow</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="nav"></header>
<main>
  <h1>Exams</h1>
  <form id="f" class="card grid" novalidate>
    <div><label for="type">Type</label><select id="type"><option value="tuition">Tuition (my students)</option><option value="uni">University (my own exam)</option></select></div>
    <div><label for="title" id="tl">Exam title</label><input id="title" placeholder="Monthly test - Math" required></div>
    <div id="clsBox"><label for="cls">Class</label><select id="cls"></select></div>
    <div><label for="date">Date</label><input id="date" type="date" required></div>
    <div id="timeBox" hidden><label for="time">Time</label><input id="time" type="time"></div>
    <div id="roomBox" hidden><label for="room">Room / notes</label><input id="room"></div>
    <div><label for="total" id="totl">Total marks</label><input id="total" type="number" min="1"></div>
    <div><button class="btn">Add exam</button></div>
  </form>
  <div class="card tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Exam</th><th>Class / room</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>

  <div class="card" id="box" hidden>
    <h2 id="bt"></h2>
    <div class="grid">
      <div class="stat"><small>Average</small><h2 id="avg">-</h2></div>
      <div class="stat"><small>Highest</small><h2 id="hi">-</h2></div>
      <div class="stat"><small>Marks entered</small><h2 id="cnt">0</h2></div>
    </div>
    <div class="tbl"><table><thead><tr><th>Roll</th><th>Name</th><th>Attendance on exam day</th><th>Marks</th><th>%</th></tr></thead><tbody id="mrows"></tbody></table></div>
    <p style="margin-top:12px"><button id="save" class="btn">Save marks</button> <button id="csv" class="btn light">Export CSV</button></p>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/main.js"></script><script src="js/exams.js"></script>
</body></html>
