<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Students - TuitionFlow</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="nav"></header>
<main>
  <h1>Students</h1>
  <form id="f" class="card grid" novalidate>
    <div><label for="name">Name</label><input id="name" required></div>
    <div><label for="roll">Roll</label><input id="roll" required></div>
    <div><label for="cls">Class</label><select id="cls" required></select></div>
    <div><label for="phone">Phone</label><input id="phone" type="tel" pattern="01[0-9]{9}" placeholder="01XXXXXXXXX"></div>
    <div><label for="fee">Monthly fee (৳)</label><input id="fee" type="number" min="0" required></div>
    <div style="align-self:end"><button class="btn">Add student</button></div>
  </form>
  <div class="card grid">
    <div><label for="q">Search name / roll</label><input id="q" type="search"></div>
    <div><label for="fc">Class</label><select id="fc"><option value="">All</option></select></div>
    <div><label for="fs">Status</label><select id="fs"><option value="">All</option><option>active</option><option>inactive</option></select></div>
    <div><label for="so">Sort</label><select id="so"><option value="name">Name</option><option value="fee">Fee (high first)</option></select></div>
    <div style="align-self:end"><button id="csv" class="btn light">Export CSV</button></div>
  </div>
  <div class="card tbl"><table><thead><tr><th>Roll</th><th>Name</th><th>Class</th><th>Phone</th><th>Fee</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/main.js"></script><script src="js/students.js"></script>
</body></html>
