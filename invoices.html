<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices - TuitionFlow</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="nav"></header>
<main>
  <div class="page-head"><div><span class="eyebrow">Billing</span><h1>Monthly invoices</h1><p class="page-sub">Create clean, printable tuition invoices for your students.</p></div></div>
  <div class="card glass invoice-tools">
    <div><label for="teacher">Teacher name</label><input id="teacher" type="text" placeholder="Enter your name" autocomplete="name"></div>
    <div><label for="month">Month</label><input id="month" type="month"></div>
    <div class="save-wrap"><button id="saveTeacher" class="btn">Save teacher name</button></div>
  </div>
  <div class="card tbl"><table><thead><tr><th>Student</th><th>Class</th><th>Fee</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/main.js"></script><script src="js/invoices.js"></script>
</body></html>
