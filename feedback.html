<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback - TuitionFlow</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="nav"></header>
<main>
  <h1>Feedback and ratings</h1>
  <form id="f" class="card grid" novalidate>
    <div><label for="stu">Student</label><select id="stu" required></select></div>
    <div><label for="from">From</label><select id="from"><option value="Student">Student</option><option value="Parent">Parent</option></select></div>
    <div><label for="rate">Rating</label><select id="rate"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
    <div><label for="txt">Comment or suggestion</label><input id="txt"></div>
    <div style="align-self:end"><button class="btn">Save</button></div>
  </form>
  <div class="card stat"><small>Average rating</small><h2 id="avg">-</h2></div>
  <div class="card tbl"><table><thead><tr><th>Date</th><th>Student</th><th>From</th><th>Rating</th><th>Comment</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/main.js"></script><script src="js/feedback.js"></script>
</body></html>
