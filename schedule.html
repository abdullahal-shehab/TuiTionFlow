<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule - TuitionFlow</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="nav"></header>
<main>
  <h1>Weekly routine</h1>
  <div class="card">
    <div class="grid">
      <div><label for="vf">Show tuition for</label><select id="vf"></select></div>
    </div>
    <p><small>Orange = my university classes. Blue = student classes.</small></p>
    <div class="wk" id="wk"></div>
        <h2 style="margin-top:20px">Missed classes <small>(last 30 days, <span id="mcount">0</span> waiting for make-up)</small></h2>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Student</th><th>Class</th><th>Slot</th><th>Make-up</th><th></th></tr></thead><tbody id="mlist"></tbody></table></div>
  </div>

  <h2>Add student routine</h2>
  <form id="f" class="card" novalidate>
    <label>Students <button type="button" id="selAll" class="btn light" style="min-height:32px;padding:2px 10px;margin-left:8px">Select all</button></label>
    <div id="stus" class="chk-list"></div>
    <label style="margin-top:12px">Days</label>
    <div id="days" class="chk-list"></div>
    <div class="grid" style="margin-top:12px">
      <div><label for="start">Start</label><input id="start" type="time" required></div>
      <div><label for="end">End</label><input id="end" type="time" required></div>
      <div><label for="loc">Location</label><input id="loc"></div>
      <div><label for="notes">Notes</label><input id="notes"></div>
      <div style="align-self:end"><button class="btn">Add to routine</button></div>
    </div>
  </form>

  <h2>Add my university class</h2>
  <form id="uf" class="card" novalidate>
    <div class="grid">
      <div><label for="ucourse">Course / subject</label><input id="ucourse" required></div>
      <div><label for="uroom">Room / building</label><input id="uroom"></div>
      <div><label for="ustart">Start</label><input id="ustart" type="time" required></div>
      <div><label for="uend">End</label><input id="uend" type="time" required></div>
      <div><label for="unotes">Notes</label><input id="unotes" placeholder="Teacher, exam, assignment"></div>
    </div>
    <label style="margin-top:12px">Days</label>
    <div id="udays" class="chk-list"></div>
    <button class="btn" style="margin-top:12px">Add university class</button>
  </form>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/main.js"></script><script src="js/schedule.js"></script>
</body></html>
